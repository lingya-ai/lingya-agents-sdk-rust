name: Verify generated SDK
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: lingya-agents-sdk-rust
      - uses: actions/checkout@v5
        with:
          repository: lingya-ai/lingya-agents-openapi
          ref: v1.0.0
          path: lingya-agents-openapi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: python -m pip install ruff==0.16.7
      - run: npm ci
        working-directory: lingya-agents-openapi
      - name: Verify every managed file and deterministic regeneration
        run: |
          node lingya-agents-openapi/scripts/generate-sdks.mjs --language=rust --check
          node lingya-agents-openapi/scripts/generate-sdks.mjs --language=rust --check
