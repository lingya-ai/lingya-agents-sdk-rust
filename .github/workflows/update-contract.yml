name: Update contract

on:
  repository_dispatch:
    types: [contract-released]
  workflow_dispatch:
    inputs:
      contract_tag:
        description: Contract tag such as v0.1.3
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CONTRACT_TAG: ${{ github.event.client_payload.tag || inputs.contract_tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Download contract artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CONTRACT_TAG" --repo lingya-ai/lingya-agents-openapi --pattern lingya-agents-v1.yaml --output openapi/lingya-agents-v1.yaml --clobber
          gh release download "$CONTRACT_TAG" --repo lingya-ai/lingya-agents-openapi --pattern endpoints.json --output openapi/endpoints.json --clobber
          printf 'lingya-ai/lingya-agents-openapi@%s\n' "$CONTRACT_TAG" > CONTRACT_VERSION
      - run: python3 scripts/generate_bound_api.py && cargo test --all-targets
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/contract-${{ env.CONTRACT_TAG }}
          commit-message: "chore: update contract to ${{ env.CONTRACT_TAG }}"
          title: "chore: update contract to ${{ env.CONTRACT_TAG }}"
          body: "Regenerates the channel-bound SDK facade from lingya-agents-openapi `${{ env.CONTRACT_TAG }}` and runs the complete test suite."
