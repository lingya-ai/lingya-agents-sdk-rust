name: Update contract
on:
  repository_dispatch:
    types: [contract-released]
  workflow_dispatch:
    inputs:
      contract_tag:
        description: Contract tag such as v1.0.0
        required: true
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CONTRACT_TAG: ${{ github.event.client_payload.tag || inputs.contract_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: lingya-agents-sdk-rust
      - uses: actions/checkout@v5
        with:
          repository: lingya-ai/lingya-agents-openapi
          ref: ${{ env.CONTRACT_TAG }}
          path: lingya-agents-openapi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      - run: python -m pip install ruff==0.16.7
      - run: npm ci
        working-directory: lingya-agents-openapi
      - name: Regenerate models, runtime, facades and manifests
        run: node lingya-agents-openapi/scripts/generate-sdks.mjs --language=rust
      - name: Verify SDK
        working-directory: lingya-agents-sdk-rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo package --locked
      - uses: peter-evans/create-pull-request@v7
        with:
          path: lingya-agents-sdk-rust
          branch: automation/contract-${{ env.CONTRACT_TAG }}
          commit-message: 'chore: update SDK from ${{ env.CONTRACT_TAG }}'
          title: 'chore: update SDK from ${{ env.CONTRACT_TAG }}'
          body: 'Regenerates all managed SDK sources and runs SDK checks.'
